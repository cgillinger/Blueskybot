services:
  blueskybot:
    image: ghcr.io/cgillinger/blueskybot:latest
    # build: .   # uncomment to build from source instead of pulling the image
    container_name: blueskybot
    env_file: .env
    volumes:
      - ./data:/data   # feeds.txt + lastPostedLinks.json + deferredItems.json
    restart: always
